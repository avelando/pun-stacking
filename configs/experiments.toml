[experiment]
name = "rigorous-pun-stacking"
random_state = 42

[data]
dataset = "puntuguese"
split_strategy = "pair_preserving"
split_seeds = [13, 21, 40, 42, 73, 101]
pair_id_field = "pair_id"
train_fraction = 0.70
validation_fraction = 0.10
test_fraction = 0.20
root = "data"

[cross_validation]
n_splits = 5
group_by_pair = true
random_state = 42

[training]
model_seeds = [13, 21, 40, 42, 73, 101]

[graphs]
names = ["cooccurrence", "ppmi", "pun_context"]
svd_dimensions = 4
svd_seed = 42
oof_mode = "on_demand"

[graphs.cooccurrence]
window = 5
min_freq = 5
top_k = 30

[graphs.ppmi]
window = 5
min_freq = 5
top_k = 30

[graphs.pun_context]
min_freq = 3
top_k = 40

[embeddings]
models = [
    "intfloat/multilingual-e5-large",
    "Qwen/Qwen3-Embedding-0.6B",
    "google/embeddinggemma-300m",
    "sentence-transformers/paraphrase-multilingual-mpnet-base-v2",
]
fine_tune = false
batch_size = 8
max_length = 512
normalize = true
device = "cuda"

[bertimbau]
model = "neuralmind/bert-large-portuguese-cased"
enabled = true
max_length = 256
learning_rate = 0.00002
epochs = 6
batch_size = 8
evaluation_batch_size = 8
gradient_accumulation_steps = 1
weight_decay = 0.01
warmup_ratio = 0.1
max_grad_norm = 1.0
early_stopping_patience = 2
save_total_limit = 2
cleanup_checkpoints_after_success = true

[stacking]
enabled = true
meta_classifier = "logistic_regression"
use_oof = true

[evaluation]
primary_metric = "accuracy"
metrics = ["accuracy", "f1_macro", "pair_exact_accuracy"]

[base_models]
classifier = "logistic_regression"
C = 1.0
max_iter = 2000
tfidf_min_df = 2